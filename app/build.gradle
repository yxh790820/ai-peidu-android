plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 签名信息放本地 keystore.properties（已被 .gitignore 排除）；没有该文件时用系统 debug 签名
def ksProps = new Properties()
def ksFile = rootProject.file("keystore.properties")
def hasKs = ksFile.exists()
if (hasKs) {
    ksFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.yxh.peidu'
    compileSdk 34

    defaultConfig {
        applicationId "com.yxh.peidu"
        minSdk 24
        targetSdk 34
        versionCode 35
        versionName "1.9.7"
    }

    signingConfigs {
        if (hasKs) {
            release {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKs) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            if (hasKs) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    /* 单元测试跑在 JVM 上：WikiClient 里的 android.util.Log 直接返回默认值，
       这样检索逻辑（简繁变体 / 英文回退）能在电脑上直接连局域网 Kiwix 验，不用每次都装模拟器 */
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    /* 单元测试里要用真的 org.json：mockable android.jar 那个是空实现（length() 恒 0），
       不换成真实现的话 lookup() 会直接空手返回，看起来像「代码没生效」 */
    testImplementation 'org.json:json:20240303'
}
